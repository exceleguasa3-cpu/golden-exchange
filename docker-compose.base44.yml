# Base44 sandbox environment for this repository.
#
# The repo is a static site: two self-contained HTML pages served straight from
# the cloned source, so there is no build step, no dependencies and no database.
# `.base44/preview-server.mjs` (Node built-ins only) serves the source on host
# port 3000 with live reload; it runs on a plain node base image with the repo
# bind-mounted, so edits are visible immediately.
services:
  web:
    image: node:22-alpine
    working_dir: /app
    command: ["node", ".base44/preview-server.mjs"]
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      HOST: "0.0.0.0"
      BASE44_PREVIEW_MODE: "${BASE44_PREVIEW_MODE:-}"
    volumes:
      - ./:/app
    restart: on-failure
    labels:
      base44.project: "Golden Exchange"
      base44.kind: "web"
      base44.port: "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 5
